backend:
  name: github
  repo: bartram-studio/bartramstudio-website
  branch: diagnostic/relation-value-field-name
  base_url: https://bartram-studio-oauth.netlify.app
  auth_endpoint: auth

media_folder: "public/images/products"
public_folder: "/images/products"

site_url: https://bartramstudio.com
display_url: https://bartramstudio.com

collections:
  - name: "products"
    label: "Products"
    label_singular: "Product"
    folder: "src/content/products"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["title", "price", "status", "category"]
    view_filters:
      - label: "Available"
        field: status
        pattern: "available"
      - label: "Pending"
        field: status
        pattern: "pending"
      - label: "Sold"
        field: status
        pattern: "sold"
      - label: "Featured"
        field: featured
        pattern: true
    view_groups:
      - label: "By Category"
        field: category
      - label: "By Status"
        field: status
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The name of the piece as it appears on the site."

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Resin Art"
          - "Coastal Keepsakes"
          - "Jewelry Organization"
          - "Wall Art"
          - "Seasonal Collection"
          - "Botanical Collection"
          - "Gift Ideas"
        hint: "Diagnostic only — temporary hardcoded list, not the managed Categories collection."

      - label: "Description"
        name: "descriptionParagraphs"
        widget: "list"
        min: 0
        allow_add: true
        collapsed: false
        label_singular: "Paragraph"
        hint: "Add one paragraph per entry. Use the handles to reorder. Each paragraph renders separately on the product page."
        field:
          label: "Paragraph"
          name: "paragraph"
          widget: "text"

      - label: "Price (USD)"
        name: "price"
        widget: "number"
        min: 1
        value_type: "int"
        hint: "Enter the price in whole dollars. Example: 85 means $85."

      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Available — ready to purchase", value: "available" }
          - { label: "Pending — sale in progress", value: "pending" }
          - { label: "Sold — no longer available", value: "sold" }
        default: "available"

      - label: "Quantity Available"
        name: "quantity"
        widget: "number"
        min: 0
        default: 1
        value_type: "int"
        hint: "How many are available. Use 1 for one-of-a-kind pieces."

      - label: "Featured on Homepage"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Turn on to show this piece in the Featured section on the homepage."

      - label: "Custom Order Available"
        name: "customOrderAvailable"
        widget: "boolean"
        default: false
        hint: "Turn on if you can make a similar piece to order."

      - label: "Photos"
        name: "images"
        widget: "list"
        min: 0
        max: 8
        allow_add: true
        collapsed: false
        label_singular: "Photo"
        hint: "Drag photos to reorder them. The first photo becomes the Shop thumbnail, the product page main image, and the related-product image. Aim for clear, well-lit shots at least 800x600px."
        field:
          label: "Photo"
          name: "image"
          widget: "image"

      - label: "Videos"
        name: "videos"
        widget: "list"
        min: 0
        max: 3
        allow_add: true
        collapsed: true
        required: false
        label_singular: "Video"
        hint: "Optional. MP4 is preferred — do not upload raw iPhone MOV files directly. Convert to web-ready MP4 first (H.264 video, AAC audio). Keep clips 5–15 seconds and under 20 MiB. Cloudflare Pages may reject individual files over 25 MiB."
        field:
          label: "Video"
          name: "video"
          widget: "file"
          media_folder: "/public/videos/products"
          public_folder: "/videos/products"

  - name: "categories"
    label: "Categories"
    label_singular: "Category"
    folder: "src/content/categories"
    create: true
    delete: false
    identifier_field: name
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["name", "homepageOrder", "active"]
    view_filters:
      - label: "Active"
        field: active
        pattern: true
      - label: "Inactive"
        field: active
        pattern: false
      - label: "Shown on Homepage"
        field: showOnHomepage
        pattern: true
    fields:
      - label: "Name"
        name: "name"
        widget: "string"
        hint: "Displayed throughout the site. Used to generate the category's permanent internal identifier when first created — renaming Name later will not change that identifier."

      - label: "Description"
        name: "description"
        widget: "text"
        required: false
        hint: "Short description. Not shown yet — reserved for a future homepage layout."

      - label: "Category Icon"
        name: "categoryIcon"
        widget: "select"
        default: "✨"
        hint: "Choose the symbol that best represents this category. It may be used on the homepage and in other category displays."
        options:
          - { label: "Seashell 🐚", value: "🐚" }
          - { label: "Ocean Wave 🌊", value: "🌊" }
          - { label: "Jewelry Ring 💍", value: "💍" }
          - { label: "Framed Art 🖼️", value: "🖼️" }
          - { label: "Flower 🌸", value: "🌸" }
          - { label: "Leaf 🌿", value: "🌿" }
          - { label: "Gift 🎁", value: "🎁" }
          - { label: "Sparkles ✨", value: "✨" }
          - { label: "Star ⭐", value: "⭐" }
          - { label: "Coral 🪸", value: "🪸" }
          - { label: "Oyster 🦪", value: "🦪" }
          - { label: "Pearl / White Heart 🤍", value: "🤍" }
          - { label: "Sun ☀️", value: "☀️" }
          - { label: "Palm Tree 🌴", value: "🌴" }
          - { label: "Anchor ⚓", value: "⚓" }

      - label: "Category Accent"
        name: "categoryAccent"
        widget: "select"
        hint: "Pick from the approved Bartram Studio palette. Custom colors are not supported."
        options:
          - { label: "Sea Glass", value: "sea-glass" }
          - { label: "Deep Tide", value: "deep-tide" }
          - { label: "Resin Amber", value: "resin-amber" }
          - { label: "Shell Pink", value: "shell-pink" }
          - { label: "Driftwood", value: "driftwood" }

      - label: "Featured Image"
        name: "featuredImage"
        widget: "image"
        required: false
        media_folder: "/public/images/categories"
        public_folder: "/images/categories"
        hint: "Not used yet — reserved for future category landing pages."

      - label: "Homepage Order"
        name: "homepageOrder"
        widget: "number"
        value_type: "int"
        default: 0
        hint: "Controls ordering for a future homepage category display. Lower numbers appear first."

      - label: "Show on Homepage"
        name: "showOnHomepage"
        widget: "boolean"
        default: false
        hint: "Reserved for future use — has no effect on the site yet."

      - label: "Active"
        name: "active"
        widget: "boolean"
        default: true
        hint: "Turn this off to mark the category as retired. Existing products can continue using it. Inactive categories may still appear in the product category selector."

  - name: "site"
    label: "Site Content"
    label_singular: "Page"
    description: "Edit the wording on the Home, About, and Contact pages."
    files:

      - name: "home"
        label: "Homepage"
        file: "src/content/site/home.md"
        fields:
          - { label: "Hero — Eyebrow", name: "heroEyebrow", widget: "string", hint: "Small uppercase label above the main headline." }
          - { label: "Hero — Title", name: "heroTitle", widget: "string", hint: "First line of the main headline." }
          - { label: "Hero — Title Emphasis", name: "heroTitleEmphasis", widget: "string", hint: "Second line of the headline, shown in italic teal." }
          - { label: "Hero — Lead Text", name: "heroLead", widget: "text", hint: "Paragraph below the headline." }
          - label: "Hero — Image"
            name: "heroImage"
            widget: "image"
            required: false
            allow_multiple: false
            media_folder: "/public/images/site"
            public_folder: "/images/site"
            hint: "Optional. Upload an image to replace the decorative shell artwork on the right side of the homepage hero. Leave blank to keep the default artwork. Recommended: square or portrait, at least 600×600px."
          - { label: "Featured — Eyebrow", name: "featuredEyebrow", widget: "string" }
          - { label: "Featured — Title", name: "featuredTitle", widget: "string" }
          - { label: "Featured — Subtitle", name: "featuredText", widget: "string" }
          - { label: "Categories — Eyebrow", name: "categoriesEyebrow", widget: "string" }
          - { label: "Categories — Title", name: "categoriesTitle", widget: "string" }
          - { label: "About Strip — Eyebrow", name: "aboutEyebrow", widget: "string" }
          - { label: "About Strip — Title", name: "aboutTitle", widget: "string" }
          - { label: "About Strip — Text", name: "aboutText", widget: "text" }
          - { label: "CTA — Title", name: "ctaTitle", widget: "string", hint: "First line, plain text." }
          - { label: "CTA — Title Emphasis", name: "ctaTitleEmphasis", widget: "string", hint: "Second line, shown in italic coral." }
          - { label: "CTA — Body Text", name: "ctaText", widget: "text" }
          - { label: "CTA — Button Text", name: "ctaButtonText", widget: "string" }

          # ── Homepage background colours ──
          - label: "Hero Background Colour"
            name: "heroBg"
            widget: "select"
            required: false
            hint: "Background colour of the page header/hero section."
            options:
              - { label: "Site Default (Sand)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "Band Background Colour"
            name: "bandBg"
            widget: "select"
            required: false
            hint: "Background of the strip below the hero. Default is dark teal with white text."
            options:
              - { label: "Site Default (Dark Teal)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "Featured Products Background Colour"
            name: "featuredBg"
            widget: "select"
            required: false
            hint: "Background colour of the Featured Products section."
            options:
              - { label: "Site Default (Sand)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "Categories Background Colour"
            name: "categoriesBg"
            widget: "select"
            required: false
            hint: "Background colour of the Shop by Category section."
            options:
              - { label: "Site Default (Shell White)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "About Strip Background Colour"
            name: "aboutBg"
            widget: "select"
            required: false
            hint: "Background colour of the About Strip section."
            options:
              - { label: "Site Default (Sand)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "CTA Box Background Colour"
            name: "ctaBg"
            widget: "select"
            required: false
            hint: 'Background colour of the custom order call-to-action box.'
            default: "soft-shell"
            options:
              - { label: "Soft Shell White (default)", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }

      - name: "about"
        label: "About Page"
        file: "src/content/site/about.md"
        fields:
          - { label: "Page Hero — Eyebrow", name: "pageEyebrow", widget: "string" }
          - { label: "Page Hero — Title", name: "pageTitle", widget: "string" }
          - { label: "Page Hero — Intro", name: "pageIntro", widget: "string" }
          - { label: "Intro Section — Eyebrow", name: "introEyebrow", widget: "string" }
          - { label: "Intro Section — Title", name: "introTitle", widget: "string" }
          - label: "Intro Section — Paragraphs"
            name: "introParagraphs"
            widget: "list"
            allow_add: true
            label_singular: "Paragraph"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "About Portrait"
            name: "profileImage"
            widget: "image"
            required: false
            allow_multiple: false
            media_folder: "/public/images/site"
            public_folder: "/images/site"
            hint: "Upload a portrait photo of Amanda. Displays in the intro section. Recommended: portrait orientation (3:4 ratio), at least 600×800px."
          - { label: "Craft Section — Eyebrow", name: "craftEyebrow", widget: "string" }
          - { label: "Craft Section — Title", name: "craftTitle", widget: "string" }
          - { label: "Craft Section — Subtitle", name: "craftText", widget: "string" }
          - label: "Process Steps"
            name: "processSteps"
            widget: "list"
            allow_add: true
            label_singular: "Step"
            fields:
              - { label: "Step Title", name: "title", widget: "string" }
              - { label: "Step Description", name: "body", widget: "text" }
          - { label: "Values — Eyebrow", name: "valuesEyebrow", widget: "string" }
          - { label: "Values — Title", name: "valuesTitle", widget: "string" }
          - label: "Values — Paragraphs"
            name: "valuesParagraphs"
            widget: "list"
            allow_add: true
            label_singular: "Paragraph"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - { label: "Quote — Text", name: "quoteText", widget: "text", hint: "Do not include quotation marks — they are added automatically." }
          - { label: "Quote — Citation", name: "quoteCitation", widget: "string" }
          - { label: "Contact CTA — Title", name: "contactCtaTitle", widget: "string" }
          - { label: "Contact CTA — Body Text", name: "contactCtaText", widget: "text" }
          - { label: "Contact CTA — Button Text", name: "contactCtaButtonText", widget: "string" }

          # ── About page background colours ──
          - label: "Hero Background Colour"
            name: "heroBg"
            widget: "select"
            required: false
            hint: "Background colour of the page header/hero section."
            options:
              - { label: "Site Default (Sand)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "Intro Section Background Colour"
            name: "aboutIntroBg"
            widget: "select"
            required: false
            hint: "Background colour of the intro section below the hero."
            options:
              - { label: "Site Default (Shell White)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "Craft Section Background Colour"
            name: "aboutCraftBg"
            widget: "select"
            required: false
            hint: "Background colour of the What I Make / process steps section."
            options:
              - { label: "Site Default (Sand)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "Values Section Background Colour"
            name: "aboutValuesBg"
            widget: "select"
            required: false
            hint: "Background colour of the Values section."
            options:
              - { label: "Site Default (Shell White)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "CTA Strip Background Colour"
            name: "aboutCtaBg"
            widget: "select"
            required: false
            hint: "Background colour of the contact CTA strip. Default is dark teal."
            options:
              - { label: "Site Default (Dark Teal)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }

      - name: "contact"
        label: "Contact Page"
        file: "src/content/site/contact.md"
        fields:
          - { label: "Page Hero — Eyebrow", name: "pageEyebrow", widget: "string" }
          - { label: "Page Hero — Title", name: "pageTitle", widget: "string" }
          - { label: "Page Hero — Intro", name: "pageIntro", widget: "string" }
          - { label: "Form — Title", name: "formTitle", widget: "string" }
          - { label: "Form — Intro", name: "formIntro", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string", hint: "Shown as a clickable mailto link in the sidebar." }
          - { label: "Instagram Handle", name: "instagramHandle", widget: "string", hint: "Include the @ symbol, e.g. @bartramstudio" }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Custom Orders — Title", name: "customOrdersTitle", widget: "string" }
          - label: "Custom Orders — Paragraphs"
            name: "customOrdersParagraphs"
            widget: "list"
            allow_add: true
            label_singular: "Paragraph"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - { label: "Response Time", name: "responseTime", widget: "string", hint: "e.g. 1–2 business days" }
          - label: "FAQ Items"
            name: "faqItems"
            widget: "list"
            allow_add: true
            label_singular: "FAQ"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

          # ── Contact page background colours ──
          - label: "Hero Background Colour"
            name: "heroBg"
            widget: "select"
            required: false
            hint: "Background colour of the page header/hero section."
            options:
              - { label: "Site Default (Sand)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "Main Section Background Colour"
            name: "contactMainBg"
            widget: "select"
            required: false
            hint: "Background colour of the form and sidebar section."
            options:
              - { label: "Site Default (Shell White)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "Custom Orders Card Background Colour"
            name: "contactAccentBg"
            widget: "select"
            required: false
            hint: "Background colour of the Custom Orders sidebar card."
            options:
              - { label: "Site Default (Sand)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "Contact Methods Card Background Colour"
            name: "contactMethodsBg"
            widget: "select"
            required: false
            hint: "Background colour of the \"Other ways to reach me\" sidebar card."
            options:
              - { label: "Site Default (White)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "FAQ Card Background Colour"
            name: "contactFaqBg"
            widget: "select"
            required: false
            hint: "Background colour of the Frequently Asked sidebar card."
            options:
              - { label: "Site Default (White)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
      - name: "shop"
        label: "Shop Page"
        file: "src/content/site/shop.md"
        fields:
          - { label: "Page Hero — Eyebrow", name: "pageEyebrow", widget: "string" }
          - { label: "Page Hero — Title", name: "pageTitle", widget: "string" }
          - { label: "Page Hero — Intro", name: "pageIntro", widget: "string" }

          # ── Shop page background colours ──
          - label: "Hero Background Colour"
            name: "heroBg"
            widget: "select"
            required: false
            hint: "Background colour of the page header/hero section."
            options:
              - { label: "Site Default (Sand)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "Product Grid Background Colour"
            name: "shopGridBg"
            widget: "select"
            required: false
            hint: "Background colour of the product grid and filter bar section."
            options:
              - { label: "Site Default (Shell White)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }
          - label: "Custom Order CTA Background Colour"
            name: "shopCtaBg"
            widget: "select"
            required: false
            hint: "Background colour of the custom order prompt at the bottom of the shop."
            options:
              - { label: "Site Default (Sand)", value: "" }
              - { label: "Soft Shell White", value: "soft-shell" }
              - { label: "Sea Glass Green", value: "sea-glass" }
              - { label: "Resin Amber", value: "resin-amber" }
              - { label: "Shell Pink", value: "shell-pink" }
              - { label: "Driftwood Gray", value: "driftwood" }

  - name: "brand"
    label: "Brand Settings"
    description: "Control the overall typography style of the site."
    files:

      - name: "settings"
        label: "Typography Theme"
        file: "src/content/brand/settings.md"
        fields:
          - label: "Typography Theme"
            name: "typographyTheme"
            widget: "select"
            hint: "Choose the font style for the whole site. Changes take effect after publishing."
            options:
              - { label: "Coastal Serif (current look — elegant & airy)", value: "coastal-serif" }
              - { label: "Clean Modern (crisper & editorial)", value: "clean-modern" }
              - { label: "Soft Handmade (rounder & classic artisan)", value: "soft-handmade" }
            default: "coastal-serif"
          - label: "Secondary Text Tone"
            name: "secondaryTextTone"
            widget: "select"
            hint: "Controls the colour of helper text, labels, navigation links, footer links, and other low-emphasis text. Soft matches the current appearance."
            options:
              - { label: "Soft — current appearance", value: "soft" }
              - { label: "Medium — easier to read", value: "medium" }
              - { label: "Dark — highest contrast", value: "dark" }
            default: "soft"
